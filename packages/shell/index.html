<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NetX — Network Education Platform</title>
  </head>
  <body>
    <div id="root"><p style="color:white;padding:20px;">Loading NetX...</p></div>
    <script>
      // One-time migration: clear old data (v3 — WiFi fix)
      try {
        if (!localStorage.getItem('netx-port-v3')) {
          localStorage.removeItem('netx-topology');
          localStorage.removeItem('netx-plugin-data');
          localStorage.removeItem('netx-cli-configs');
          localStorage.setItem('netx-port-v3', '1');
          console.log('[Migration] Cleared old data for WiFi update');
        }
      } catch(e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
