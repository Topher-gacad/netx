<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NetX — Network Education Platform</title>
  </head>
  <body>
    <div id="root"><p style="color:white;padding:20px;">Loading NetX...</p></div>
    <script>
      // One-time migration: clear old data with mismatched port IDs (v1 → v2)
      try {
        if (!localStorage.getItem('netx-port-v2')) {
          localStorage.removeItem('netx-topology');
          localStorage.removeItem('netx-plugin-data');
          localStorage.removeItem('netx-cli-configs');
          localStorage.setItem('netx-port-v2', '1');
          console.log('[Migration] Cleared old topology data for port ID update');
        }
      } catch(e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
